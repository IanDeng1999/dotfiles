onboarding = false
# herdr configuration
# PREFIX: Ctrl+;  (Ctrl + Semicolon)

[keys]
prefix = "ctrl+k"

[terminal]
default_shell = ""
shell_mode = "auto"
new_cwd = "follow"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
pane_borders = true
pane_gaps = true
confirm_close = true
prompt_new_tab_name = true
mouse_capture = true
redraw_on_focus_gained = true

[ui.toast]
delivery = "herdr"

[session]
resume_agents_on_restore = true

[theme]
name = "kanagawa"
