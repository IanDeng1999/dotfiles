- link:
    ~/.config/wezterm: wezterm
    ~/.config/zellij: zellij
    ~/.config/herdr: herdr
    ~/.config/nvim: nvim
    ~/.vimrc: vim/.vimrc
    ~/.agents: .agents
    ~/.pi/agent/prompts: .pi/prompts
    ~/.pi/agent/SYSTEM.md: .pi/SYSTEM.md
    ~/.pi/agent/settings.json: .pi/agent/settings.json
    ~/.pi/agent/zentui.json: zentui/zentui.json
    ~/.myzshrc: zsh/.myzshrc

- shell:
    - [grep -q -F 'source ~/.myzshrc' ~/.zshrc 2>/dev/null || echo 'if [[ -f ~/.myzshrc ]]; then
  source ~/.myzshrc
fi' >> ~/.zshrc]
